# uwiki's own tasks; tools, lint and release tasks come from devkit (.config/mise/conf.d/devkit.toml),
# mise merges both: `mise tasks` lists them all.

[tasks.test]
description = "run tests"
run = "uv run --no-project --with markdown-it-py --with linkify-it-py python -m unittest discover tests"

[tasks.build]
description = "build sdist and wheel"
run = "uv build"
