# Managed by devkit (github.com/hiqdev/devkit): a pushed tag v* runs mise run check and creates the GitHub
# release, which mise resolves versions and latest from. `mise run patch` tags, `mise run release` pushes.
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v5
      - run: mise run check
      - run: gh release create "$GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
