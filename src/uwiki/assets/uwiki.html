<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{title}</title>
    <style>{style}</style>
</head>
<body>
    <button id="menu" type="button" aria-label="Toggle navigation">&#9776;</button>
    <nav id="sidebar">
        <a id="home" href="#root">{title}</a>
        <div id="search">
            <input id="query" type="search" placeholder="Search" autocomplete="off" spellcheck="false" aria-label="Search">
            <kbd>/</kbd>
        </div>
        <div id="results" hidden></div>
        <ul id="toc"></ul>
    </nav>
    <main class="content">
        {content}
    </main>
    <script>{script}</script>
</body>
</html>
