[project]
name = "uwiki"
version = "0.2.0"
description = "Builds, checks, counts and wraps markdown wikis, e.g. Obsidian vaults"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["markdown"]

[project.urls]
Homepage = "https://github.com/hiqsol/uwiki"

[project.scripts]
uwiki = "uwiki.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
