[project]
name = "uwiki"
version = "0.1.0"
description = "Renders folder of markdown files to single HTML file"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["markdown"]

[project.urls]
Homepage = "https://github.com/hiqsol/uwiki"

[project.scripts]
uwiki = "uwiki.uwiki:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
